name: Setup Dependencies
description: Install C++ build dependencies, optional lint tools, and ccache

inputs:
  ccache-key:
    description: Cache namespace; use a distinct key per compiler/job
    required: false
    default: default
  lint-tools:
    description: Install clang-format, clang-tidy, and cppcheck
    required: false
    default: "false"
  build-tools:
    description: >-
      Install the CMake/Ninja/ccache/compiler/OpenCV toolchain. Set to false
      for jobs that only run lint tools (for example cppcheck).
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # Debian packages are cached between runs so the slow archive mirror is hit
    # only on a cache miss. The cache lives under the runner's home directory
    # because /var/cache/apt/archives is root-owned and the cache action
    # restores as the unprivileged runner user.
    - name: Restore apt package cache
      if: ${{ inputs.build-tools == 'true' || inputs.lint-tools == 'true' }}
      uses: actions/cache@v4
      with:
        path: ~/apt-cache
        # Stable key: package changes are rare, and apt refetches anything the
        # cache lacks. Hashing the action file would throw the cache away on
        # every workflow edit.
        key: apt-v2-${{ runner.os }}
        restore-keys: |
          apt-v2-

    - name: Install dependencies
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -euo pipefail

        # Retry transient mirror failures, but abandon a stalled connection
        # quickly instead of blocking the runner for minutes per package.
        # KeepDownloadedPackages plus a user-owned archive dir lets the cache
        # above turn repeat installs into local .deb installs.
        mkdir -p "$HOME/apt-cache/partial"
        # apt downloads as the unprivileged _apt sandbox user, which cannot
        # write a runner-owned directory unless it is world-writable. Without
        # this the cache directory stays empty and actions/cache has nothing
        # to save.
        chmod 777 "$HOME/apt-cache" "$HOME/apt-cache/partial"
        apt_opts=(
          -o Acquire::Retries=3
          -o Acquire::http::Timeout=30
          -o Acquire::https::Timeout=30
          -o APT::Keep-Downloaded-Packages=true
          -o Dir::Cache::archives="$HOME/apt-cache"
        )

        # Give update+install a shared wall-clock budget so a broken mirror
        # fails with a clear error instead of consuming the job timeout.
        apt_deadline=$(( SECONDS + 20 * 60 ))
        apt() {
          local remaining=$(( apt_deadline - SECONDS ))
          if (( remaining <= 0 )); then
            echo "::error::apt phase exceeded its 20 minute budget" >&2
            exit 124
          fi
          sudo timeout --signal=TERM --kill-after=20 "$remaining" \
            apt-get "${apt_opts[@]}" "$@"
        }

        packages=()
        if [ "${{ inputs.build-tools }}" = "true" ]; then
          # Component -dev packages only. The libopencv-dev metapackage pulls
          # libopencv-viz -> VTK -> OpenMPI -> AMD HIP, which this project does
          # not use and which dominates install time on a slow archive mirror.
          # cmake/FindOpenCV.cmake resolves the components without a config
          # file (Ubuntu ships OpenCVConfig.cmake only in libopencv-dev).
          packages+=(cmake ninja-build ccache clang-18
            libopencv-core-dev libopencv-imgproc-dev libopencv-imgcodecs-dev
            libopencv-highgui-dev libopencv-videoio-dev)
        fi
        if [ "${{ inputs.lint-tools }}" = "true" ]; then
          packages+=(clang-format-18 clang-tidy-18 cppcheck)
        fi

        apt update
        apt install -y "${packages[@]}"

        # Belt and braces: some apt versions drop the debs in the system cache
        # even with Dir::Cache::archives set. Copy whatever exists so the
        # cache is never empty.
        sudo find /var/cache/apt/archives -maxdepth 1 -name '*.deb' \
          -exec cp -n {} "$HOME/apt-cache/" \; 2>/dev/null || true
        ls "$HOME/apt-cache"/*.deb >/dev/null 2>&1 || \
          echo "::warning::apt cache is empty; the next run will download again"

    - name: Set up ccache
      if: ${{ inputs.build-tools == 'true' }}
      uses: hendrikmuhs/ccache-action@v1
      with:
        key: ${{ inputs.ccache-key }}
        max-size: 500M
