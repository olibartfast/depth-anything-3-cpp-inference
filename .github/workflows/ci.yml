name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      strict_tidy:
        description: "Treat every clang-tidy warning as an error"
        type: boolean
        default: false

# Least privilege: CI only reads the repository. No secrets are used.
permissions:
  contents: read

# A new push to a branch cancels the previous run for that branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format (clang-format)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18

      - name: Check formatting
        run: ./scripts/ci/check-format.sh --all

  build-test:
    name: Build & Test (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: clang
            cc: clang-18
            cxx: clang++-18
          - compiler: gcc
            cc: gcc
            cxx: g++
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-deps
        with:
          ccache-key: ${{ matrix.compiler }}

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DWERROR=ON \
            -DBENCHMARKS=ON \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure --output-junit test-results.xml

      - name: Benchmark smoke test
        run: ./build/benchmarks --benchmark_min_time=0.05s

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.compiler }}
          path: build/test-results.xml
          if-no-files-found: warn
          retention-days: 7

  sanitizers:
    name: Sanitizers (ASan + UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-deps
        with:
          ccache-key: sanitizers

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DSANITIZERS=ON \
            -DWERROR=ON \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          # OpenCV videoio probes gphoto2/libusb and those libraries leak
          # process-lifetime state; suppress third-party leaks only.
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/scripts/ci/lsan-suppressions.txt:print_suppressions=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure --output-junit test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-sanitizers
          path: build/test-results.xml
          if-no-files-found: warn
          retention-days: 7

  clang-tidy:
    name: Clang-Tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-deps
        with:
          ccache-key: clang-tidy
          lint-tools: "true"

      - name: Configure for compile_commands.json
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18

      - name: Run clang-tidy
        env:
          STRICT_TIDY: ${{ github.event_name == 'workflow_dispatch' && inputs.strict_tidy || false }}
        run: ./scripts/ci/run-clang-tidy.sh

      - name: Upload clang-tidy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clang-tidy-report
          path: build/clang-tidy.log
          if-no-files-found: warn
          retention-days: 7

  cppcheck:
    name: Cppcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-deps
        with:
          lint-tools: "true"

      - name: Run cppcheck
        run: ./scripts/ci/run-cppcheck.sh

      - name: Upload cppcheck report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cppcheck-report
          path: build/cppcheck.log
          if-no-files-found: warn
          retention-days: 7

  coverage:
    name: Coverage (gcov)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-deps
        with:
          ccache-key: coverage

      - name: Install coverage tools
        run: |
          python3 -m venv "$RUNNER_TEMP/coverage-venv"
          "$RUNNER_TEMP/coverage-venv/bin/pip" install --quiet --disable-pip-version-check gcovr diff-cover
          echo "$RUNNER_TEMP/coverage-venv/bin" >> "$GITHUB_PATH"

      - name: Resolve diff base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "BASE_REF=$PR_BASE_SHA" >> "$GITHUB_ENV"
          elif [ "$EVENT_NAME" = "push" ] \
            && [ -n "$BEFORE_SHA" ] \
            && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            echo "BASE_REF=$BEFORE_SHA" >> "$GITHUB_ENV"
          elif [ "$EVENT_NAME" = "push" ]; then
            echo "BASE_REF=HEAD^" >> "$GITHUB_ENV"
          else
            echo "BASE_REF=origin/master" >> "$GITHUB_ENV"
          fi

      - name: Run coverage gate
        run: ./scripts/ci/run-coverage.sh

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            build-coverage/coverage.xml
            build-coverage/coverage.txt
            build-coverage/coverage-full.txt
            build-coverage/coverage-full*.html
          if-no-files-found: warn
          retention-days: 7

  benchmark:
    name: Benchmark regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-deps
        with:
          ccache-key: benchmark

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBENCHMARKS=ON \
            -DWERROR=ON \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build benchmarks
        run: cmake --build build --target benchmarks --parallel

      - name: Run benchmark suite
        run: |
          ./build/benchmarks \
            --benchmark_min_time=0.2s \
            --benchmark_repetitions=5 \
            --benchmark_report_aggregates_only=true \
            --benchmark_out=build/benchmark.json \
            --benchmark_out_format=json

      - name: Convert benchmark results
        run: python3 scripts/ci/benchmark-to-json.py build/benchmark.json build/benchmark-action.json

      - name: Compare with stored baseline
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: customSmallerIsBetter
          output-file-path: build/benchmark-action.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          # Baselines live on a data-only branch. GitHub Pages is not used.
          gh-pages-branch: benchmark-data
          benchmark-data-dir-path: benchmarks
          alert-threshold: '150%'
          fail-on-alert: true
          comment-on-alert: false
          summary-always: true

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: |
            build/benchmark.json
            build/benchmark-action.json
          if-no-files-found: warn
          retention-days: 7

  docker:
    name: Docker build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t da3-onnx:ci .

      - name: Smoke test image
        run: docker run --rm da3-onnx:ci --help

  # Single required status check for branch protection. It fails when any
  # blocking job fails, and writes a compact result table to the run summary.
  quality-gate:
    name: Quality Gate
    if: always()
    needs: [format, build-test, sanitizers, clang-tidy, cppcheck, coverage, benchmark, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Evaluate quality gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci/quality_gate.py
